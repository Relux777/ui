# Релиз по тегу vX.Y.Z (его ставит npm run release, см. RELEASING.md): готовый CSS, архив rendit-ui.zip
# (движок, RenDit SCSS, конфиг, готовый CSS) и описание из раздела этой версии в CHANGELOG.md.
# Запустить заново для уже отправленного тега: Actions → «Релиз» → Run workflow (или
# gh workflow run release.yml -f tag=v0.2.0) — релиз создастся или обновит свои файлы.
name: Релиз

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег версии, например v0.2.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist

      - name: Архив rendit-ui.zip
        run: |
          mkdir -p pkg/rendit-ui/src/assets
          cp -r rendit-code pkg/rendit-ui/
          rm -f pkg/rendit-ui/rendit-code/vscode/*.vsix
          cp -r src/assets/scss pkg/rendit-ui/src/assets/
          cp -r dist rendit.config.mjs README.md CHANGELOG.md LICENSE pkg/rendit-ui/
          cd pkg && zip -qr ../rendit-ui.zip rendit-ui

      - name: Описание из CHANGELOG.md
        run: |
          node -e '
            const tag = process.env.TAG;
            const v = tag.replace(/^v/, "");
            const log = require("fs").readFileSync("CHANGELOG.md", "utf8");
            const start = log.indexOf(`## [${v}]`);
            if (start < 0) { console.error(`нет раздела ${v} в CHANGELOG.md`); process.exit(1); }
            const next = log.indexOf("\n## [", start + 1);
            const body = log.slice(log.indexOf("\n", start) + 1, next < 0 ? undefined : next).trim();
            const cdn = `https://cdn.jsdelivr.net/gh/${process.env.GITHUB_REPOSITORY}@${tag}/dist/rendit-ui.min.css`;
            require("fs").writeFileSync("notes.md", `${body}\n\nГотовый CSS с CDN:\n\n    <link rel="stylesheet" href="${cdn}">\n`);
          '

      - name: Релиз на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="rendit-ui.zip dist/rendit-ui.css dist/rendit-ui.min.css"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" $FILES --title "RenDit UI $TAG" --notes-file notes.md --verify-tag
          fi
